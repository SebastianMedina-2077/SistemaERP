# Config sensible fuera del repo: application-local.properties (gitignored) en la
# raiz del proyecto sobreescribe lo de aqui (credenciales SMTP, etc.).
spring.config.import=optional:file:./application-local.properties

# ===== Base de datos MySQL =====
# Credenciales sobreescribibles por variables de entorno (DB_USER / DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/erp_mamatomato
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# 'validate' contrasta las entidades contra el esquema ya creado (bd/MamaTomato_V0.21.sql).
# Si la validacion fallara por las columnas ENUM de MySQL, cambiar temporalmente a 'none'.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== MVC =====
# Habilita _method en formularios (PUT/PATCH/DELETE) para Thymeleaf
spring.mvc.hiddenmethod.filter.enabled=true

# ===== Caja =====
# PIN de supervisor para desbloquear una caja tras 3 cuadres fallidos.
caja.supervisor-pin=${CAJA_SUPERVISOR_PIN:1234}

# ===== Empresa / comprobante electronico (boleta) =====
# Datos fiscales del emisor que se imprimen en la boleta y se codifican en el QR SUNAT.
# La serie y el codigo de tipo (03 boleta / 01 factura) los define el enum TipoComprobante.
empresa.ruc=20552277482
empresa.razon-social=STARFOOD PERU S.A.C. - STARFOOD
empresa.nombre-comercial=Mamma Tomato
empresa.direccion=Av. Los Olivos 123 - Lima, Peru
empresa.telefono=(01) 555-1234
# Adquiriente generico (consumidor final sin documento): tipoDoc=0, numDoc=0.
empresa.tipo-doc-adquiriente=0
empresa.num-doc-adquiriente=0

# ===== Tienda web (clientes) =====
# Secreto HS256 de los JWT de la tienda. El default es SOLO de desarrollo: en
# produccion se sobreescribe por variable de entorno o application-local.properties.
tienda.jwt.secret=${TIENDA_JWT_SECRET:mamma-tomato-tienda-dev-secret-2026-no-usar-en-produccion-cambiar-por-entorno}

# ===== Email (envio de boleta electronica) =====
# Las credenciales SMTP van en application-local.properties (gitignored, raiz del
# proyecto). Sin ellas el envio no se realiza y la venta no falla (el comprobante
# queda con email_estado = NO_CONFIGURADO).
